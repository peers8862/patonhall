name: Update counts

# Pulls subscriber and member counts from Kit, rebuilds the site, and commits
# only when a number has actually changed — so the history stays readable
# instead of collecting an empty commit every hour.

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the hour to avoid the busy minute
  workflow_dispatch:        # and on demand, from the Actions tab

permissions:
  contents: write

concurrency:
  group: counts
  cancel-in-progress: false

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: pip install --quiet markdown

      - name: Fetch counts from Kit
        env:
          KIT_API_SECRET: ${{ secrets.KIT_API_SECRET }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python3 scripts/fetch_counts.py

      - name: Rebuild site
        run: python3 build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- counts.json index.html; then
            echo "No change in the numbers — nothing to commit."
            exit 0
          fi
          SUMMARY=$(python3 -c 'import json; c = json.load(open("counts.json")); print(c["subscribers"], "on the list,", c["members"], "members")')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counts.json index.html
          git commit -m "Update counts: $SUMMARY"
          git push
