<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paton Hall has moved</title>
<link rel="canonical" href="https://paton.babb.tel/">
<meta name="robots" content="noindex, follow">
<!-- Fallback for readers without JavaScript. The script below does better:
     it carries the original path across, so a link to a specific document
     lands on that document rather than the front page. -->
<meta http-equiv="refresh" content="1; url=https://paton.babb.tel/">
<script>
(function () {
  // GitHub Pages serves this file for any path that does not exist, which is
  // every old URL now that the content has gone. Rebuild the equivalent
  // address on the new domain: /patonhall/papers/x.html -> /papers/x.html
  var p = location.pathname.replace(/^\/patonhall(?=\/|$)/, "");
  if (p === "" || p === "/") p = "/";
  location.replace("https://paton.babb.tel" + p + location.search + location.hash);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%2316212c%22/><text y=%2212%22 x=%228%22 text-anchor=%22middle%22 font-size=%2211%22 font-family=%22Georgia,serif%22 fill=%22%23f8efd6%22>P</text></svg>">
<style>
  :root { --paper:#e6e5e1; --enamel:#16212c; --ink:#1b1e21; --ink-2:#5a5f64;
          --tube:#f8efd6; --rule:#b6b2a9;
          --serif: Charter,"Bitstream Charter","Sitka Text","Iowan Old Style",Cambria,Georgia,serif;
          --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
          --mono: ui-monospace,"DejaVu Sans Mono","SF Mono",Menlo,Consolas,monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#14181c; --enamel:#0d141a; --ink:#e4e2db; --ink-2:#9aa1a8; --rule:#333c44; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; padding:2rem 1.25rem;
         background:var(--paper); color:var(--ink); font-family:var(--sans);
         line-height:1.6; }
  .card { max-width:32rem; }
  .sign { display:inline-block; background:var(--enamel); color:var(--tube);
          font-family:var(--serif); font-size:1.05rem; letter-spacing:.045em;
          padding:.36rem 1.05rem .42rem; border:1px solid var(--enamel);
          text-decoration:none; margin-bottom:1.75rem; }
  h1 { font-family:var(--serif); font-weight:600; font-size:clamp(1.8rem,5vw,2.6rem);
       line-height:1.1; margin:0 0 .9rem; }
  p { margin:0 0 1.1rem; max-width:30rem; }
  .go { display:inline-block; font-family:var(--mono); font-size:.76rem;
        letter-spacing:.11em; text-transform:uppercase; color:var(--paper);
        background:var(--enamel); border:1px solid var(--enamel);
        padding:.75rem 1.5rem; text-decoration:none; margin-top:.4rem; }
  .go:hover { background:transparent; color:var(--ink); }
  .note { font-family:var(--mono); font-size:.7rem; letter-spacing:.05em;
          color:var(--ink-2); margin-top:2rem; padding-top:1rem;
          border-top:1px solid var(--rule); }
</style>
</head>
<body>
  <div class="card">
    <a class="sign" href="https://paton.babb.tel/">Paton Hall</a>
    <h1>This address has moved.</h1>
    <p>Paton Hall now lives at <strong>paton.babb.tel</strong>. You should be
      sent to the same page there automatically.</p>
    <p><a class="go" href="https://paton.babb.tel/">Go to paton.babb.tel</a></p>
    <p class="note">If nothing happens, follow the link above.</p>
  </div>
</body>
</html>
